; /etc/php/8.4/fpm/pool.d/peygir.conf
;
; Its own pool running as the peygir user, so the web, the queue worker, cron
; and deploys all write storage/ as the same user. Mixing www-data with a
; deploy user is how laravel.log ends up unwritable at 3am.

[peygir]
user = peygir
group = peygir

listen = /run/php/peygir.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for a 4GB VPS. Roughly 60MB per worker; raise with the RAM.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Longer than OLLAMA_TIMEOUT, shorter than nginx's fastcgi_read_timeout.
request_terminate_timeout = 170s

php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
