; /etc/supervisor/conf.d/peygir.conf
;
; The queue worker. Without it inbound SMS replies ("انجام شد", "۲ روز دیگر")
; are accepted by the webhook and then never processed.

[program:peygir-queue]
command=/usr/bin/php8.4 /var/www/peygir/artisan queue:work --tries=3 --sleep=3 --max-time=3600
directory=/var/www/peygir
user=peygir
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/peygir-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
