# /etc/nginx/sites-available/peygir
#
# Replace peygir.ir with your domain in server_name. Certbot adds the 443 block
# and the http -> https redirect itself; do not write them by hand.

server {
    listen 80;
    server_name peygir.ir www.peygir.ir;

    root /var/www/peygir/public;
    index index.php;

    charset utf-8;

    # Accounting exports (CSV) are uploaded through the import page.
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite puts a content hash in every file name, so these never change.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The service worker must be re-checked on every visit, or phones keep
    # running the old version after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/peygir.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Free-text capture waits on the local model for up to OLLAMA_TIMEOUT
        # (120s). The default 60s would cut it off with a 504.
        fastcgi_read_timeout 180s;
    }

    # .env, .git and friends. .well-known stays open for certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
