<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>اتصال برقرار نیست</title>
    <style>
        /* Inline on purpose: this page has to render when nothing else loads. */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #0f172a;
            font-family: Tahoma, Arial, sans-serif;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
        }
        h1 { font-size: 18px; margin: 16px 0 0; }
        p { font-size: 14px; line-height: 2; color: #475569; margin: 12px 0 0; }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 12px;
            background: #283f9f;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true">
            <rect width="512" height="512" rx="120" fill="#283f9f"/>
            <path d="M397 204.7A150 150 0 1 1 282 108.3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="40" stroke-linecap="round"/>
            <path d="M178 258l60 60 158-172" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>اتصال اینترنت برقرار نیست</h1>

        <p>
            برای دیدن کارها به اینترنت نیاز است.
            <br>
            اگر کاری را تمام کرده‌اید، می‌توانید همان پیامک پیگیری را پاسخ دهید:
            <strong>۱ = انجام شد</strong>
        </p>

        <button onclick="location.reload()">تلاش دوباره</button>
    </div>
</body>
</html>
